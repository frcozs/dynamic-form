@if (selectedSchema$ | async; as schema) {
    <div class="wizard-layout">
    <aside class="wizard-sidebar">
        <app-section-nav />
    </aside>

    <div class="wizard-container">
    <header class="wizard-header">
        <div>
        @if (currentSection$ | async; as currentSection) {
            <h2 class="section-title">
                {{ currentSection.title }}
            </h2>
        }
        </div>
        <app-autosave-status />
    </header>

    <main class="wizard-content">
        <app-dynamic-form />
    </main>

    <footer class="wizard-footer">
        @if ((isFirstSection$ | async) === false) {
            <button
            (click)="onPrevious()"
            class="btn btn-secondary">
                Previous
            </button>
        }

        @if ((isLastSection$ | async) === false) {
        <button
            (click)="onNext()"
            [disabled]="(isCurrentSectionValid$ | async) === false"
            class="btn btn-primary">
            Next
        </button>
        } @else {
        <button
            (click)="onSubmit()"
            [disabled]="(isCurrentSectionValid$ | async) === false"
            class="btn btn-submit">
            Submit
        </button>
        }
    </footer>
    </div>
    </div>
}
