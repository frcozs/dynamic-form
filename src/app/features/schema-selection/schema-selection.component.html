
<div class="selection-card">
  <h2 class="selection-title">What do you need to purchase?</h2>

  @if (schemasState$ | async; as state) {
    @switch (state.status) {
      @case ('loading') {
        <p class="loading-text">Loading schemas...</p>
      }
      @case ('error') {
        <div class="error-container">
          <p class="error-text" role="alert">Something went wrong loading the available forms.</p>
          <button type="button" class="btn-retry" (click)="retry()">Try again</button>
        </div>
      }
      @case ('success') {
        <div class="schema-buttons-group">
            @for (schema of state.schemas; track schema.id) {
            <button
                type="button"
                class="pill-btn"
                [class.selected]="selectedSchema?.id === schema.id"
                [attr.aria-pressed]="selectedSchema?.id === schema.id"
                (click)="selectSchema(schema)"
            >
                <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path [attr.d]="schema | schemaLabel | schemaIcon"/>
                </svg>
                <span class="btn-text">{{ schema | schemaLabel }}</span>
            </button>
            }
        </div>

        <div class="action-container">
            <button
            type="button"
            class="btn-start"
            [disabled]="!selectedSchema"
            (click)="onStart()"
            >
            Start
            </button>
        </div>
      }
    }
  }
</div>
