
<div class="selection-card">
  <h2 class="selection-title">What do you need to purchase?</h2>

  @if (schemasState$ | async; as state) {
    @switch (state.status) {
      @case ('loading') {
        <p class="loading-text">Loading schemas...</p>
      }
      @case ('error') {
        <div class="error-container">
          <p class="error-text">Something went wrong loading the available forms.</p>
          <button type="button" class="btn-retry" (click)="retry()">Try again</button>
        </div>
      }
      @case ('success') {
        <div class="schema-buttons-group">
            @for (schema of state.schemas; track schema.id) {
            <button
                type="button"
                class="pill-btn"
                [class.selected]="selectedSchema?.id === schema.id"
                (click)="selectSchema(schema)"
            >
                @if (schema.title.toLowerCase().includes('software')) {
                <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z"/>
                </svg>
                } @else {
                <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M6 2h12a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm2 3v2h8V5H8zm0 4v2h8V9H8zm0 4v2h8v-2H8z"/>
                </svg>
                }
                <span class="btn-text">{{ schema.title.includes('Software') ? 'Software' : 'Hardware' }}</span>
            </button>
            }
        </div>

        <div class="action-container">
            <button
            type="button"
            class="btn-start"
            [disabled]="!selectedSchema"
            (click)="onStart()"
            >
            Start
            </button>
        </div>
      }
    }
  }
</div>
